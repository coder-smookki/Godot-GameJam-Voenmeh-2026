name: Проверки и сборка

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Линтеры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Установить gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Формат кода
        run: gdformat --check src tests

      - name: Линтер
        run: gdlint src tests

      - name: Только docstring-комментарии
        run: |
          if grep -rnE "^[[:space:]]*#[^#]" --include="*.gd" src tests; then
            echo "::error::В коде допускаются только комментарии-docstring (##)"
            exit 1
          fi

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot

      - name: Импорт ресурсов
        run: |
          godot --headless --path . --import > /dev/null 2>&1 || true
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Импорт завершился с ошибками скриптов"
            exit 1
          fi

      - name: Тесты
        run: godot --headless --path . res://tests/test_runner.tscn

  build:
    name: Сборка .exe и macOS
    runs-on: ubuntu-latest
    needs: test
    env:
      BUILD_VERSION: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Короткая версия сборки
        run: echo "BUILD_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Импорт ресурсов
        run: |
          godot --headless --path . --import > /dev/null 2>&1 || true
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Импорт завершился с ошибками скриптов"
            exit 1
          fi

      - name: Экспорт Windows
        run: |
          sed -i "s|^config/version=.*|config/version=\"${BUILD_VERSION}\"|" project.godot
          mkdir -p build
          godot --headless --path . --export-release "Windows" build/Eksperiment404.exe 2>&1 | tee export.log
          if [ ! -s build/Eksperiment404.exe ] || [ "$(stat -c%s build/Eksperiment404.exe)" -lt 10000000 ]; then
            echo "::error::Файл Eksperiment404.exe не собран"
            exit 1
          fi
          ls -la build

      - name: Экспорт macOS
        run: |
          godot --headless --path . --export-release "macOS" build/Eksperiment404-macos.zip 2>&1 | tee export-macos.log
          if [ ! -s build/Eksperiment404-macos.zip ] || [ "$(stat -c%s build/Eksperiment404-macos.zip)" -lt 10000000 ]; then
            echo "::error::Архив Eksperiment404-macos.zip не собран"
            exit 1
          fi
          unzip -l build/Eksperiment404-macos.zip | head -20

      - uses: actions/upload-artifact@v7
        with:
          name: Eksperiment404-windows-${{ env.BUILD_VERSION }}
          path: build/Eksperiment404.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: Eksperiment404-macos-${{ env.BUILD_VERSION }}
          path: build/Eksperiment404-macos.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: Запуск на macOS
    runs-on: macos-latest
    needs: build
    steps:
      - name: Короткая версия сборки
        run: echo "BUILD_VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          name: Eksperiment404-macos-${{ env.BUILD_VERSION }}

      - name: Запуск без окна
        run: |
          unzip -q Eksperiment404-macos.zip -d game
          app="$(find game -maxdepth 2 -name '*.app' | head -1)"
          binary="$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)"
          echo "приложение: $app"
          codesign -dv "$app" 2>&1 || true
          "$binary" --headless --quit-after 600 --log-file "$PWD/macos.log"
          cat macos.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load" macos.log; then
            echo "::error::В журнале есть ошибки скриптов"
            exit 1
          fi
