name: Проверки и сборка

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Название файлов в релизе; GitHub сам заменяет в имени файла пробелы и знаки, а подпись
  # на странице релиза остаётся как есть.
  GAME_NAME: "MAKE A ERROR, and you're an error"
  # Стадия сборок из dev: alpha, пока в игре нет всех этажей и финала; потом beta.
  # Релизы из main выходят без стадии: v0.<номер pull request>.
  STAGE: alpha

jobs:
  lint:
    name: Линтеры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Установить gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Формат кода
        run: gdformat --check src tests

      - name: Линтер
        run: gdlint src tests

      - name: Только docstring-комментарии
        run: |
          if grep -rnE "^[[:space:]]*#[^#]" --include="*.gd" src tests; then
            echo "::error::В коде допускаются только комментарии-docstring (##)"
            exit 1
          fi

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot

      - name: Импорт ресурсов
        run: |
          godot --headless --path . --import > /dev/null 2>&1 || true
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Импорт завершился с ошибками скриптов"
            exit 1
          fi

      - name: Тесты
        run: godot --headless --path . res://tests/test_runner.tscn

  build:
    name: Сборка .exe и macOS
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Версия сборки
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            last="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 100 \
              --json tagName -q '.[].tagName' | sed -n 's/^v0\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)"
            version="v0.$(( ${last:-0} + 1 ))-${STAGE}.${GITHUB_RUN_NUMBER}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "версия: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"

      - name: Импорт ресурсов
        run: |
          godot --headless --path . --import > /dev/null 2>&1 || true
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Импорт завершился с ошибками скриптов"
            exit 1
          fi

      - name: Экспорт Windows
        run: |
          sed -i "s|^config/version=.*|config/version=\"${BUILD_VERSION}\"|" project.godot
          mkdir -p build
          godot --headless --path . --export-release "Windows" build/Eksperiment404.exe 2>&1 | tee export.log
          if [ ! -s build/Eksperiment404.exe ] || [ "$(stat -c%s build/Eksperiment404.exe)" -lt 10000000 ]; then
            echo "::error::Файл Eksperiment404.exe не собран"
            exit 1
          fi
          ls -la build

      - name: Экспорт macOS
        run: |
          godot --headless --path . --export-release "macOS" build/Eksperiment404-macos.zip 2>&1 | tee export-macos.log
          if [ ! -s build/Eksperiment404-macos.zip ] || [ "$(stat -c%s build/Eksperiment404-macos.zip)" -lt 10000000 ]; then
            echo "::error::Архив Eksperiment404-macos.zip не собран"
            exit 1
          fi
          unzip -l build/Eksperiment404-macos.zip | head -20

      - uses: actions/upload-artifact@v7
        with:
          name: Eksperiment404-windows-${{ env.BUILD_VERSION }}
          path: build/Eksperiment404.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: Eksperiment404-macos-${{ env.BUILD_VERSION }}
          path: build/Eksperiment404-macos.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: Запуск на macOS
    runs-on: macos-latest
    needs: build
    env:
      BUILD_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Eksperiment404-macos-${{ env.BUILD_VERSION }}

      - name: Запуск без окна
        run: |
          unzip -q Eksperiment404-macos.zip -d game
          app="$(find game -maxdepth 2 -name '*.app' | head -1)"
          binary="$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)"
          echo "приложение: $app"
          codesign -dv "$app" 2>&1 || true
          "$binary" --headless --quit-after 600 --log-file "$PWD/macos.log"
          cat macos.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load" macos.log; then
            echo "::error::В журнале есть ошибки скриптов"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          path: source
          sparse-checkout: .github/scripts

      - name: Образ диска .dmg
        run: |
          bash source/.github/scripts/make_dmg.sh Eksperiment404-macos.zip Eksperiment404.dmg
          mount="$(mktemp -d)"
          hdiutil attach Eksperiment404.dmg -nobrowse -readonly -mountpoint "$mount"
          app="$(find "$mount" -maxdepth 1 -name '*.app' | head -1)"
          binary="$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)"
          "$binary" --headless --quit-after 120 --log-file "$PWD/dmg.log"
          hdiutil detach "$mount"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load" dmg.log; then
            echo "::error::Игра из .dmg пишет ошибки скриптов"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Eksperiment404-dmg-${{ env.BUILD_VERSION }}
          path: Eksperiment404.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  prerelease:
    name: Альфа-релиз из dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    needs: [build, macos]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_VERSION: ${{ needs.build.outputs.version }}
      COMMIT_TITLE: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Eksperiment404-windows-${{ env.BUILD_VERSION }}
          path: build

      - uses: actions/download-artifact@v7
        with:
          name: Eksperiment404-dmg-${{ env.BUILD_VERSION }}
          path: build

      - name: Файлы релиза с названием игры
        run: |
          mkdir -p out
          cp build/Eksperiment404.exe "out/$GAME_NAME.exe"
          cp build/Eksperiment404.dmg "out/$GAME_NAME.dmg"
          cd out
          sha256sum "$GAME_NAME.exe" > "$GAME_NAME.exe.sha256"
          sha256sum "$GAME_NAME.dmg" > "$GAME_NAME.dmg.sha256"
          ls -la

      - name: Опубликовать предрелиз
        run: |
          {
            echo "Тестовая сборка из ветки dev (стадия ${STAGE}), может содержать ошибки."
            echo
            echo "Коммит ${GITHUB_SHA::7}: $(printf '%s\n' "$COMMIT_TITLE" | head -1)"
          } > notes.md
          gh release create "$BUILD_VERSION" \
            "out/$GAME_NAME.exe#$GAME_NAME.exe" "out/$GAME_NAME.exe.sha256#$GAME_NAME.exe.sha256" \
            "out/$GAME_NAME.dmg#$GAME_NAME.dmg" "out/$GAME_NAME.dmg.sha256#$GAME_NAME.dmg.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MAKE A ERROR $BUILD_VERSION" --notes-file notes.md
