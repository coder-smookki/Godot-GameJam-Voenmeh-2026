name: Релиз

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Сборка Windows и macOS
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      BUILD_VERSION: v0.${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Импорт ресурсов
        run: |
          godot --headless --path . --import > /dev/null 2>&1 || true
          godot --headless --path . --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log; then
            echo "::error::Импорт завершился с ошибками скриптов"
            exit 1
          fi

      - name: Экспорт Windows
        run: |
          sed -i "s|^config/version=.*|config/version=\"${BUILD_VERSION}\"|" project.godot
          mkdir -p build
          godot --headless --path . --export-release "Windows" build/Eksperiment404.exe 2>&1 | tee export.log
          if [ ! -s build/Eksperiment404.exe ] || [ "$(stat -c%s build/Eksperiment404.exe)" -lt 10000000 ]; then
            echo "::error::Файл Eksperiment404.exe не собран"
            exit 1
          fi
          ls -la build

      - name: Экспорт macOS
        run: |
          godot --headless --path . --export-release "macOS" build/Eksperiment404-macos.zip 2>&1 | tee export-macos.log
          if [ ! -s build/Eksperiment404-macos.zip ] || [ "$(stat -c%s build/Eksperiment404-macos.zip)" -lt 10000000 ]; then
            echo "::error::Архив Eksperiment404-macos.zip не собран"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-builds
          path: build/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  dmg:
    name: Образ диска .dmg для macOS
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v7
        with:
          name: release-builds
          path: build

      - name: Собрать .dmg
        run: bash .github/scripts/make_dmg.sh build/Eksperiment404-macos.zip Eksperiment404.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: release-dmg
          path: Eksperiment404.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Релиз из pull request (Windows, macOS .zip и .dmg)
    runs-on: ubuntu-latest
    needs: [build, dmg]
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      BUILD_VERSION: v0.${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-builds
          path: build

      - uses: actions/download-artifact@v7
        with:
          name: release-dmg
          path: build

      - name: Контрольные суммы
        working-directory: build
        run: |
          sha256sum Eksperiment404.exe > Eksperiment404.exe.sha256
          sha256sum Eksperiment404-macos.zip > Eksperiment404-macos.zip.sha256
          sha256sum Eksperiment404.dmg > Eksperiment404.dmg.sha256
          ls -la

      - name: Опубликовать релиз
        run: |
          files=(build/Eksperiment404.exe build/Eksperiment404.exe.sha256
            build/Eksperiment404-macos.zip build/Eksperiment404-macos.zip.sha256
            build/Eksperiment404.dmg build/Eksperiment404.dmg.sha256)
          printf '%s\n' "$PR_BODY" > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            gh release create "$BUILD_VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$MERGE_SHA" --title "$PR_TITLE" --generate-notes
          else
            gh release create "$BUILD_VERSION" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$MERGE_SHA" --title "$PR_TITLE" --notes-file notes.md
          fi
