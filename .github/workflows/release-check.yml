name: Проверка релиза

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1; пусто - последний"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Запуск .exe на Windows
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Скачать релиз
        shell: pwsh
        run: |
          if ($env:TAG) {
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*.exe" --pattern "*.exe.sha256" --dir release
          } else {
            gh release download --repo $env:GITHUB_REPOSITORY --pattern "*.exe" --pattern "*.exe.sha256" --dir release
          }
          Get-ChildItem release
          $exe = (Get-ChildItem release -Filter *.exe | Select-Object -First 1).FullName
          Copy-Item $exe "$env:GITHUB_WORKSPACE\game.exe"
          $sha = (Get-ChildItem release -Filter *.exe.sha256 | Select-Object -First 1).FullName
          Copy-Item $sha "$env:GITHUB_WORKSPACE\game.exe.sha256"

      - name: Контрольная сумма
        shell: pwsh
        run: |
          $expected = ((Get-Content game.exe.sha256) -split '\s+')[0].ToLower()
          $actual = (Get-FileHash game.exe -Algorithm SHA256).Hash.ToLower()
          Write-Output "ожидалась $expected"
          Write-Output "получена  $actual"
          if ($expected -ne $actual) { throw "SHA-256 не совпадает" }

      - name: Иконка и описание .exe
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon("$env:GITHUB_WORKSPACE\game.exe")
          $icon.ToBitmap().Save("$env:GITHUB_WORKSPACE\exe-icon.png")
          (Get-Item game.exe).VersionInfo | Format-List ProductName, FileDescription

      - name: Запуск без окна
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE\headless.log"
          $game = Start-Process -FilePath game.exe `
            -ArgumentList "--headless", "--quit-after", "600", "--log-file", $log `
            -Wait -PassThru
          Get-Content $log
          Write-Output "код выхода: $($game.ExitCode)"
          if ($game.ExitCode -ne 0) { throw "игра завершилась с кодом $($game.ExitCode)" }
          if (Select-String -Path $log -Pattern "SCRIPT ERROR", "Parse Error", "Failed to load") {
            throw "в журнале есть ошибки скриптов"
          }

      - name: Запись кадров с отрисовкой
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force frames | Out-Null
          $log = "$env:GITHUB_WORKSPACE\movie.log"
          $movie = "$env:GITHUB_WORKSPACE\frames\frame.png"
          $game = Start-Process -FilePath game.exe `
            -ArgumentList "--write-movie", $movie, "--fixed-fps", "30", "--quit-after", "150", "--log-file", $log `
            -Wait -PassThru
          Get-Content $log
          Write-Output "код выхода: $($game.ExitCode)"
          $count = (Get-ChildItem frames -Filter *.png).Count
          Write-Output "кадров: $count"
          if ($count -eq 0) { throw "кадры не записаны" }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-check
          path: |
            headless.log
            movie.log
            exe-icon.png
            frames/
          if-no-files-found: warn
          retention-days: 7

  macos:
    name: Запуск .dmg на macOS
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Скачать релиз
        run: |
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.dmg" --pattern "*.dmg.sha256" --dir release
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.dmg" --pattern "*.dmg.sha256" --dir release
          fi
          ls -la release
          cp release/*.dmg game.dmg
          cp release/*.dmg.sha256 game.dmg.sha256

      - name: Контрольная сумма
        run: |
          expected="$(cut -d' ' -f1 game.dmg.sha256)"
          actual="$(shasum -a 256 game.dmg | cut -d' ' -f1)"
          echo "ожидалась $expected"
          echo "получена  $actual"
          [ "$expected" = "$actual" ]

      - name: Запуск из .dmg
        run: |
          hdiutil verify game.dmg
          mount="$(mktemp -d)"
          hdiutil attach game.dmg -nobrowse -readonly -mountpoint "$mount"
          ls -la "$mount"
          app="$(find "$mount" -maxdepth 1 -name '*.app' | head -1)"
          binary="$(find "$app/Contents/MacOS" -type f -perm -u+x | head -1)"
          codesign -dv "$app" 2>&1 || true
          ls "$app/Contents/Resources" | grep -i icns || true
          "$binary" --headless --quit-after 600 --log-file "$PWD/dmg.log"
          hdiutil detach "$mount"
          cat dmg.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load" dmg.log; then
            echo "::error::В журнале есть ошибки скриптов"
            exit 1
          fi
